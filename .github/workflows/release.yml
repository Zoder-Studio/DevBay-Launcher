name: Release

on:
  workflow_run:
    workflows: [ "Build APK" ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine tag for this commit
        id: get_tag
        run: |
          TAG=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep '^v' | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No version tag found on this commit. Skipping release."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "Found tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download unsigned APK from Build APK
        if: steps.get_tag.outputs.tag != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: devbay-launcher-release
          path: apk-release

      - name: Install SDK
        if: steps.get_tag.outputs.tag != ''
        uses: ./.github/actions/setup-sdk

      - name: Install Android SDK build-tools
        if: steps.get_tag.outputs.tag != ''
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Decode signing keystore
        if: steps.get_tag.outputs.tag != ''
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Align and sign release APK
        if: steps.get_tag.outputs.tag != ''
        run: |
          set -e
          APK_UNSIGNED=$(find apk-release -name "*.apk" | head -n 1)
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          TAG_NAME="${{ steps.get_tag.outputs.tag }}"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$APK_UNSIGNED" "DevBayLauncher-$TAG_NAME-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --out "DevBayLauncher-$TAG_NAME.apk" \
            "DevBayLauncher-$TAG_NAME-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify "DevBayLauncher-$TAG_NAME.apk"

      - name: Remove keystore from runner
        if: always()
        run: rm -f release.keystore

      - name: Create GitHub Release
        if: steps.get_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: DevBay Launcher ${{ steps.get_tag.outputs.tag }}
          files: DevBayLauncher-${{ steps.get_tag.outputs.tag }}.apk
          generate_release_notes: true